<!DOCTYPE html>
<html>
<head>
    <title>Flat Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'dashboard' %}">
            Flat Manager
        </a>

        <!-- Burger button -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible content -->
        <div class="collapse navbar-collapse" id="mainNavbar">

            <div class="navbar-nav me-auto">
                <a class="nav-link" href="{% url 'dashboard' %}">
                    Dashboard
                </a>

                <a class="nav-link" href="{% url 'transaction_list' %}">
                    Transactions
                </a>

                <a class="nav-link" href="{% url 'add_transaction' %}">
                    Add Transaction
                </a>

                <a class="nav-link" href="{% url 'my_claims' %}">
                    My Claims
                </a>
                <a class="nav-link" href="{% url 'roster' %}">
                    Chore Roster
                </a>
            </div>

            <div class="d-flex align-items-lg-center flex-column flex-lg-row gap-2">
                <span class="navbar-text text-light">
                    {{ user.username }}
                </span>

                {% if user.username == "stella" %}
                    <a href="{% url 'admin:index' %}" class="btn btn-outline-secondary">
                        Admin
                    </a>
                    {% endif %}
            </div>

        </div>

    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
