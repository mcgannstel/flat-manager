<!DOCTYPE html>
<html>
<head>
    <title>Flat Manager</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'dashboard' %}">
            Flat Manager
        </a>

        <div class="navbar-nav">

            <a class="nav-link" href="{% url 'dashboard' %}">
                Dashboard
            </a>

            <a class="nav-link" href="{% url 'transaction_list' %}">
                Transactions
            </a>

            <a class="nav-link" href="{% url 'add_transaction' %}">
                Add Transaction
            </a>
            <a class="nav-link" href="{% url 'my_claims' %}">My Claims</a>
        </div>

        <div class="d-flex">

            <span class="navbar-text text-light me-3">
                {{ user.username }}
            </span>

            <a class="btn btn-outline-light btn-sm" href="/admin/">
                Admin
            </a>

        </div>

    </div>
</nav>


<div class="container mt-4">

{% block content %}
{% endblock %}

</div>


<!-- Bootstrap JS (optional but useful later) -->
<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
